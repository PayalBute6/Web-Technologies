<!DOCTYPE html> 
<html> 
<head> 
<style> 
.container{ 
display:grid; 
grid-template-columns: 
1fr 1fr 1fr; 
gap:10px; 
} 
.box{ 
background:skyblue; 
padding:20px; 
} 
@media(max-width:768px){ 
.container{ 
grid-template-columns: 
1fr 1fr; 
} 
} 
@media(max-width:480px){ 
.container{ 
grid-template-columns: 
1fr; 
} 
} 
</style> 
</head> 
<body> 
<div class="container"> 
<div class="box">Box 1</div> 
<div class="box">Box 2</div> 
<div class="box">Box 3</div> 
</div> 
</body> 
</html>
