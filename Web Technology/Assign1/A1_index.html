<!DOCTYPE html>
<html>

<head>
    <title>My First Web Page</title>
    <style>
        /* Styles for the entire page background and overall layout */
        body {
            font-family: Arial, sans-serif; /* Sets the default font for the whole page */
            background-color: #f4f4f9;      /* A light grey/off-white background */
            color: #b72222;                 /* The default text color (red) */
            margin: 0;                      /* Removes default browser margins */
            padding: 40px;                  /* Adds space inside the page edges */
            text-align: center;             /* Centers all the content horizontally */
        }
        
        /* Styles for the main heading */
        h1 {
            color: #033669;                 /* Overrides default text color to dark blue */
            margin-bottom: 10px;            /* Adds a small gap below the heading */
        }
        
        /* Styles for paragraphs */
        p {
            font-size: 18px;                /* Makes the text slightly larger and more readable */
            margin-bottom: 20px;            /* Adds space below the paragraph */
        }
        
        /* Styles for the image */
        img {
            max-width: 100%;                /* Ensures the image shrinks to fit small screens */
            height: auto;                   /* Keeps the image's proportions when it shrinks */
            border: 5px solid #fff;         /* Adds a thick white border like a photo frame */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Adds a soft drop shadow behind the image */
            border-radius: 8px;             /* Slightly rounds the corners of the image */
        }
    </style>
</head>

<body>
    <h1>Welcome to Web Technology</h1>
    <p>
        This is my first HTML webpage.
    </p>
    <img src="https://miro.medium.com/v2/resize:fit:1100/format:webp/1*hsixMeK5wXtI438p7z8Psw.jpeg" alt="Sample Image">
</body>

</html>
