<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Store</title>
    <style>
        header {
            background-color: black;
            color: white;
            padding: 10px;
            text-align: center;
        }
        .products {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .item {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
            width: 200px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Online Electronics Store</h1>
    </header>

    <h2>Featured Products</h2>
    <div class="products">
        <div class="item">
            <h3>Laptop</h3>
            <p>Price: Rs. 50,000</p>
            <button onclick="alert('Laptop added to cart!')">Buy Now</button>
        </div>

        <div class="item">
            <h3>Headphones</h3>
            <p>Price: Rs. 2,000</p>
            <button onclick="alert('Headphones added to cart!')">Buy Now</button>
        </div>

        <div class="item">
            <h3>Smart Watch</h3>
            <p>Price: Rs. 3,000</p>
            <button onclick="alert('Smart Watch added to cart!')">Buy Now</button>
        </div>
    </div>

    <br><br>

</body>
</html>
